name: AutoWeb Independent Maintenance V2

on:
  schedule:
    - cron: '35 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autoweb-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Load existing projects
        uses: actions/checkout@v4

      - name: Audit and safely repair projects
        run: |
          python3 <<'PY'
          import json
          import re
          import hashlib
          import os
          import html
          from pathlib import Path
          from datetime import datetime, timezone
          from urllib.parse import quote
          from collections import Counter
          import xml.etree.ElementTree as ET

          BASE = "https://sabrenaexclusive-cyber.github.io/autoweb-ai-projects/"
          output = Path("maintenance-output")
          output.mkdir(exist_ok=True)

          projects = []
          issues = []
          repairs = []
          recovery = []
          warnings = []
          hashes = {}
          categories = Counter()
          urls = set()

          if Path("index.html").is_file():
              urls.add(BASE)

          checks = {
              "Missing HTML doctype": r"<!doctype\s+html",
              "Missing HTML closing tag": r"</html\s*>",
              "Missing page title": r"<title\b",
              "Missing viewport": r'<meta\b[^>]*\bname\s*=\s*["\']?viewport\b',
              "Missing meta description": r'<meta\b[^>]*\bname\s*=\s*["\']?description\b'
          }

          for file in sorted(Path("projects").glob("*/index.html")):

              if not file.is_file() or file.is_symlink():
                  continue

              if file.parent.is_symlink():
                  continue

              path = file.as_posix()
              project_id = file.parent.name

              try:
                  original = file.read_bytes().decode("utf-8")
              except UnicodeDecodeError:
                  recovery.append({
                      "path": path,
                      "reason": "Invalid UTF-8 encoding"
                  })
                  continue

              content = original

              title_match = re.search(
                  r"<title\b[^>]*>(.*?)</title>",
                  content, re.I | re.S
              )

              title = (
                  html.unescape(title_match.group(1).strip())
                  if title_match else project_id
              )

              url = BASE + quote(
                  file.parent.as_posix(), safe="/"
              ) + "/"

              valid_name = bool(re.fullmatch(
                  r"[A-Za-z0-9_-]+", project_id
              ))

              if not valid_name:
                  warnings.append({
                      "path": path,
                      "issue": "Nonstandard project folder name"
                  })

              before = [
                  message for message, pattern in checks.items()
                  if not re.search(pattern, content, re.I)
              ]

              if len(content.strip()) < 300:
                  before.append("Possible incomplete source")

              safe_to_repair = (
                  len(content.strip()) >= 300
                  and valid_name
                  and title_match is not None
                  and re.search(r"<!doctype\s+html", content, re.I)
                  and re.search(r"</html\s*>\s*$", content, re.I)
                  and re.search(r"</head\s*>", content, re.I)
              )

              if safe_to_repair:

                  additions = []
                  fixed = []

                  if "Missing viewport" in before:
                      additions.append(
                          '<meta name="viewport" content="width=device-width, initial-scale=1">'
                      )
                      fixed.append("Added mobile viewport")

                  if "Missing meta description" in before:
                      description = re.sub(
                          r"\s+", " ", title
                      ).strip()[:150]

                      if description:
                          additions.append(
                              '<meta name="description" content="'
                              + html.escape(description, quote=True)
                              + '">'
                          )
                          fixed.append("Added title-based meta description")

                  if additions:
                      content = re.sub(
                          r"</head\s*>",
                          lambda m: "\n".join(additions) + "\n" + m.group(0),
                          content,
                          count=1,
                          flags=re.I
                      )

                  if content != original:
                      file.write_bytes(content.encode("utf-8"))

                      repairs.append({
                          "path": path,
                          "repairs": fixed
                      })

              elif before:
                  recovery.append({
                      "path": path,
                      "reason": "Unsafe or incomplete source",
                      "issues": before
                  })

              remaining = [
                  message for message, pattern in checks.items()
                  if not re.search(pattern, content, re.I)
              ]

              if len(content.strip()) < 300:
                  remaining.append("Possible incomplete source")

              digest = hashlib.sha256(
                  content.encode("utf-8")
              ).hexdigest()

              if digest in hashes:
                  remaining.append(
                      "Exact duplicate of " + hashes[digest]
                  )
              else:
                  hashes[digest] = path

              lower_title = title.lower()

              if "3d" in lower_title:
                  category = "3D Website"
              elif "calculator" in lower_title:
                  category = "Calculator"
              elif "budget" in lower_title:
                  category = "Finance Tool"
              elif "planner" in lower_title:
                  category = "Planner"
              else:
                  category = "Other"

              categories[category] += 1

              if not remaining:
                  urls.add(url)

              projects.append({
                  "project_id": project_id,
                  "title": title,
                  "category": category,
                  "path": path,
                  "url": url,
                  "sha256": digest,
                  "original_issues": before,
                  "remaining_issues": remaining
              })

              for problem in remaining:
                  issues.append({
                      "path": path,
                      "issue": problem
                  })

          total = len(projects)

          if total >= 3:
              for category, count in categories.items():
                  if count / total >= 0.6:
                      warnings.append({
                          "issue": "Possible category repetition",
                          "category": category,
                          "count": count,
                          "recommendation": "Diversify future project ideas"
                      })

          report = {
              "version": "2.0",
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "total_projects": total,
              "remaining_issues": len(issues),
              "projects_repaired": len(repairs),
              "projects_requiring_recovery": len(recovery),
              "categories": dict(categories),
              "projects": projects,
              "issues": issues,
              "repairs": repairs,
              "recovery": recovery,
              "warnings": warnings,
              "audience_analytics": "Not connected",
              "make_credits_used": 0,
              "deployment_mode": "Pull request review"
          }

          (output / "project-memory.json").write_text(
              json.dumps(report, indent=2),
              encoding="utf-8"
          )

          namespace = "http://www.sitemaps.org/schemas/sitemap/0.9"
          ET.register_namespace("", namespace)

          root = ET.Element("{" + namespace + "}urlset")

          for url in sorted(urls):
              item = ET.SubElement(
                  root, "{" + namespace + "}url"
              )
              ET.SubElement(
                  item, "{" + namespace + "}loc"
              ).text = url

          ET.ElementTree(root).write(
              output / "sitemap.xml",
              encoding="utf-8",
              xml_declaration=True
          )

          summary = (
              "# AutoWeb Maintenance V2 Report\n\n"
              f"- Projects scanned: {total}\n"
              f"- Proposed project repairs: {len(repairs)}\n"
              f"- Remaining issues: {len(issues)}\n"
              f"- Projects requiring recovery: {len(recovery)}\n"
              f"- Warnings: {len(warnings)}\n"
              "- Make.com credits used: 0\n"
              "- Production branch modified: No\n"
              "- Audience analytics: Not connected\n"
              "- Validation: Static source audit\n"
              "- Repairs require pull request review\n"
          )

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a", encoding="utf-8"
          ) as f:
              f.write(summary)

          print(summary)
          PY

      - name: Save maintenance reports
        uses: actions/upload-artifact@v4
        with:
          name: autoweb-maintenance-report
          path: maintenance-output/
          retention-days: 30

      - name: Create safe repair pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: autoweb/automatic-maintenance
          base: main
          delete-branch: true
          commit-message: "AutoWeb V2: safe website repairs"
          title: "AutoWeb V2 - Automatic Website Maintenance"
          body: |
            Automated static website maintenance.

            - Add missing mobile viewport tags
            - Add missing title-based meta descriptions
            - Preserve existing website functionality
            - Never overwrite incomplete websites
            - Review changes before merging

            Detailed reports are available in Actions artifacts.
          add-paths: |
            projects/
